<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio Insights — local preview harness</title>
    <style>
      body { margin: 0; font-family: ui-sans-serif, -apple-system, sans-serif; background: #0e0e11; color: #eee; }
      .bar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: #17171c;
             border-bottom: 1px solid #2a2a31; position: sticky; top: 0; }
      .bar b { font-size: 13px; margin-right: 8px; }
      .bar button { background: #26262d; color: #eee; border: 1px solid #3a3a44; border-radius: 8px;
                    padding: 6px 12px; font-size: 13px; cursor: pointer; }
      .bar button.on { background: #6c5ce7; border-color: #6c5ce7; }
      .bar .note { margin-left: auto; color: #888; font-size: 12px; }
      .stage { display: flex; justify-content: center; padding: 28px 16px; }
      /* Inline: render in a chat-bubble-sized card like Claude shows it. */
      .stage.inline iframe { width: 460px; height: 360px; border: 1px solid #2a2a31; border-radius: 16px; background:#fff; }
      /* Fullscreen: expand like Claude's fullscreen view. */
      .stage.fullscreen { padding: 0; }
      .stage.fullscreen iframe { width: 100%; height: calc(100vh - 53px); border: 0; background:#fff; }
      iframe { color-scheme: light; }
    </style>
  </head>
  <body>
    <div class="bar">
      <b>Display mode:</b>
      <button id="b-inline" class="on">Inline card</button>
      <button id="b-full">Fullscreen</button>
      <span class="note">Mocked host bridge + real sample data — the Expand/Minimize buttons inside the view also work.</span>
    </div>
    <div id="stage" class="stage inline"><iframe id="frame" title="view"></iframe></div>

      // A mock of the @modelcontextprotocol/ext-apps `App` class, delivered to the
      // view via an import map so views/portfolio.html runs UNMODIFIED.
      const MOCK_APP_SRC = `
        export class App {
          constructor(info) { this.info = info; this.ontoolresult = null;
            this.onhostcontextchanged = null; this.ontoolinput = null; this.onteardown = null; }
          getHostContext() { return { displayMode: window.__MODE__ || "inline",
            availableDisplayModes: ["inline","fullscreen"], theme: "light" }; }
          async connect() {
            queueMicrotask(() => {
              // Real hosts push their context (incl. displayMode) before/with the result.
              this.onhostcontextchanged && this.onhostcontextchanged(this.getHostContext());
              this.ontoolresult &&
                this.ontoolresult({ structuredContent: window.__PAYLOADS__[window.__CURRENT__ || "growth"] });
            });
            return {};
          }
          async callServerTool({ name, arguments: args }) {
            if (name === "show_portfolio") {
              const id = (args && args.portfolio_id) || "growth";
              window.__CURRENT__ = id;
              return { structuredContent: window.__PAYLOADS__[id] };
            }
            return {};
          }
          requestDisplayMode({ mode }) {
            window.__MODE__ = mode;
            this.onhostcontextchanged && this.onhostcontextchanged({ displayMode: mode });
            window.parent.postMessage({ __harness: true, mode }, "*");
            return {};
          }
          log() {} sendOpenLink() {} updateModelContext() {} sendMessage() {}
        }`;
      const mockUrl = "data:text/javascript;base64," + btoa(MOCK_APP_SRC);

      const frame = document.getElementById("frame");
      const stage = document.getElementById("stage");
      let viewHtml = null;

      async function loadView(mode) {
        if (!viewHtml) viewHtml = await (await fetch("views/portfolio.html")).text();
        const inject = `
          <script>
            window.__PAYLOADS__ = ${JSON.stringify(PAYLOADS)};
            window.__MODE__ = ${JSON.stringify(mode)};
            window.__CURRENT__ = "growth";
          <\/script>
          <script type="importmap">
            { "imports": { "https://esm.sh/@modelcontextprotocol/ext-apps": ${JSON.stringify(mockUrl)} } }
          <\/script>`;
        frame.srcdoc = viewHtml.replace(/<head>/i, "<head>" + inject);
        setMode(mode);
      }

      function setMode(mode) {
        stage.className = "stage " + mode;
        document.getElementById("b-inline").classList.toggle("on", mode === "inline");
        document.getElementById("b-full").classList.toggle("on", mode === "fullscreen");
      }

      document.getElementById("b-inline").onclick = () => loadView("inline");
      document.getElementById("b-full").onclick = () => loadView("fullscreen");
      // The view's own Expand/Minimize buttons post back through the mock bridge.
      window.addEventListener("message", (e) => {
        if (e.data && e.data.__harness) setMode(e.data.mode);
      });

      loadView("inline");
    </script>
  </body>
</html>
