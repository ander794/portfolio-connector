<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio Insights — local preview harness</title>
    <style>
      body { margin: 0; font-family: ui-sans-serif, -apple-system, sans-serif; background: #0e0e11; color: #eee; }
      .bar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: #17171c;
             border-bottom: 1px solid #2a2a31; position: sticky; top: 0; z-index: 2; }
      .bar b { font-size: 13px; margin-right: 8px; }
      .bar button { background: #26262d; color: #eee; border: 1px solid #3a3a44; border-radius: 8px;
                    padding: 6px 12px; font-size: 13px; cursor: pointer; }
      .bar button.on { background: #6c5ce7; border-color: #6c5ce7; }
      .bar .note { margin-left: auto; color: #888; font-size: 12px; }
      .stage { display: flex; justify-content: center; padding: 28px 16px; }
      .stage.inline iframe { width: 460px; height: 360px; border: 1px solid #2a2a31; border-radius: 16px; background:#1b1b1f; }
      .stage.fullscreen { padding: 0; }
      .stage.fullscreen iframe { width: 100%; height: calc(100vh - 53px); border: 0; background:#1b1b1f; }
    </style>
  </head>
  <body>
    <div class="bar">
      <b>Display mode:</b>
      <button id="b-inline" class="on">Inline card</button>
      <button id="b-full">Fullscreen</button>
      <span class="note">This page acts as a real MCP-Apps host (postMessage/JSON-RPC) — no SDK, same protocol Claude uses.</span>
    </div>
    <div id="stage" class="stage inline"><iframe id="frame" title="view"></iframe></div>

    <script>

], "available": [{"id": "growth", "name": "Growth Portfolio"}, {"id": "income", "name": "Dividend Income"}]}};

      const host = { mode: "inline", current: "growth", theme: "dark" };
      const frame = document.getElementById("frame");
      const stage = document.getElementById("stage");

      function toIframe(msg) { frame.contentWindow.postMessage(msg, "*"); }
      function result(id, res) { toIframe({ jsonrpc: "2.0", id, result: res }); }
      function notify(method, params) { toIframe({ jsonrpc: "2.0", method, params }); }

      function toolResult(pid) {
        const p = PAYLOADS[pid];
        return {
          content: [{ type: "text", text: JSON.stringify(p) }],
          structuredContent: p,
        };
      }

      // Host side of the MCP-Apps protocol.
      window.addEventListener("message", (event) => {
        const msg = event.data;
        if (!msg || msg.jsonrpc !== "2.0" || event.source !== frame.contentWindow) return;

        if (msg.method === "ui/initialize") {
          result(msg.id, {
            protocolVersion: "2025-06-18",
            hostInfo: { name: "Local Harness", version: "1.0.0" },
            hostCapabilities: { serverTools: {}, openLinks: {} },
            hostContext: {
              theme: host.theme,
              displayMode: host.mode,
              availableDisplayModes: ["inline", "fullscreen"],
              // Simulate Claude's fullscreen chrome (header + bottom composer).
              safeAreaInsets: host.mode === "fullscreen"
                ? { top: 64, right: 0, bottom: 96, left: 0 }
                : { top: 0, right: 0, bottom: 0, left: 0 },
            },
          });
        } else if (msg.method === "ui/notifications/initialized") {
          // Push the first tool result, just like a host delivers it after a tool call.
          notify("ui/notifications/tool-result", toolResult(host.current));
        } else if (msg.method === "ui/request-display-mode") {
          host.mode = msg.params.mode;
          setStage(host.mode);
          result(msg.id, { mode: host.mode });
          notify("ui/notifications/host-context-changed", { displayMode: host.mode, safeAreaInsets: insetsFor(host.mode) });
        } else if (msg.method === "tools/call") {
          if (msg.params.name === "show_portfolio") {
            host.current = (msg.params.arguments && msg.params.arguments.portfolio_id) || "growth";
            result(msg.id, toolResult(host.current));
          } else {
            result(msg.id, { content: [], structuredContent: null });
          }
        } else if (msg.method === "ui/notifications/size-changed") {
          // Host sizes the iframe to the app's reported content height (inline mode).
          window.__lastSize = msg.params;
          if (host.mode === "inline") frame.style.height = msg.params.height + "px";
        }
      });

      function setStage(mode) {
        host.mode = mode;
        stage.className = "stage " + mode;
        document.getElementById("b-inline").classList.toggle("on", mode === "inline");
        document.getElementById("b-full").classList.toggle("on", mode === "fullscreen");
      }

      // Top buttons simulate the host changing the display mode.
      function insetsFor(mode) {
        return mode === "fullscreen"
          ? { top: 64, right: 0, bottom: 96, left: 0 }
          : { top: 0, right: 0, bottom: 0, left: 0 };
      }
      document.getElementById("b-inline").onclick = () => {
        setStage("inline");
        notify("ui/notifications/host-context-changed", { displayMode: "inline", safeAreaInsets: insetsFor("inline") });
      };
      document.getElementById("b-full").onclick = () => {
        setStage("fullscreen");
        notify("ui/notifications/host-context-changed", { displayMode: "fullscreen", safeAreaInsets: insetsFor("fullscreen") });
      };

      // Load the real view unmodified.
      fetch("views/portfolio.html").then((r) => r.text()).then((html) => { frame.srcdoc = html; });
    </script>
  </body>
</html>
